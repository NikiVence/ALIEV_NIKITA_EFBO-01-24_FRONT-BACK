<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои дела | Офлайн‑менеджер задач</title>
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <style>
        body { padding: 20px; max-width: 600px; margin: 0 auto; }
        .completed { text-decoration: line-through; opacity: 0.6; }
        .todo-item { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        .todo-item span { flex: 1; cursor: pointer; }
        .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 2px 8px; }
        .status-badge { font-size: 12px; background: #2ecc71; color: white; border-radius: 12px; padding: 2px 8px; }
        .offline-badge { position: fixed; bottom: 10px; right: 10px; background: #f39c12; padding: 5px 10px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>
    <h1>📋 Список дел</h1>
    <p class="text-grey">Работает даже без интернета ✨</p>

    <form id="todo-form" class="row">
        <input class="col-9" type="text" id="todo-input" placeholder="Купить хлеб..." required>
        <button class="col-3" type="submit">➕ Добавить</button>
    </form>

    <ul id="todo-list" style="list-style: none; padding: 0; margin-top: 20px;"></ul>

    <div id="offline-status" class="offline-badge">🟢 Онлайн</div>

    <script src="app.js"></script>
</body>
</html>
