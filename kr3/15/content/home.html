<div class="home-content">
    <form id="todo-form">
        <input type="text" id="todo-input" placeholder="Новая задача..." required autocomplete="off">
        <button type="submit" class="button primary">➕ Добавить</button>
    </form>
    
    <div id="stats" class="stats"></div>
    
    <div class="progress-container">
        <div id="progress-bar" class="progress-bar"></div>
    </div>
    
    <ul id="todo-list"></ul>
    
    <button id="clear-completed" class="clear-btn" style="display: none;">🗑 Очистить выполненные</button>
</div>
