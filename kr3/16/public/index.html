<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo PWA | WebSocket + Push</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#667eea">
    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container" style="max-width: 600px; margin: 0 auto; padding: 20px;">
        <h1 style="text-align: center;">✅ Todo PWA</h1>
        <p style="text-align: center; color: #666;">С WebSocket и Push уведомлениями</p>
        
        <form id="todo-form" style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="todo-input" placeholder="Новая задача..." style="flex: 1; padding: 10px;" required>
            <button type="submit" style="padding: 10px 20px;">➕ Добавить</button>
        </form>
        
        <ul id="todo-list" style="list-style: none; padding: 0;"></ul>
        
        <div style="margin-top: 20px; text-align: center; padding: 15px; background: #f5f5f5; border-radius: 10px;">
            <button id="enable-push" class="button success" style="background: #2ecc71;">🔔 Включить уведомления</button>
            <button id="disable-push" class="button error" style="background: #e74c3c; display: none;">🔕 Отключить уведомления</button>
        </div>
        
        <div id="status" style="position: fixed; bottom: 20px; right: 20px; background: #2ecc71; color: white; padding: 8px 16px; border-radius: 20px; font-size: 12px;">
            🟢 Подключено
        </div>
    </div>
    
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="/app.js"></script>
</body>
</html>
